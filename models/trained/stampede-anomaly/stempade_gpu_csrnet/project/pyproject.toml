[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stempade"
version = "0.0.1"
description = "Crowd stampede detection from video via risk-indicator fusion"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
# Phase 2 density (heavy, GPU box):  pip install -e ".[density]"
density = ["torch>=2.2", "torchvision>=0.17", "scipy>=1.12"]
# Phase 4 serving:                   pip install -e ".[serving]"
serving = ["fastapi>=0.110", "uvicorn>=0.29"]
# Phase 5 learned fusion:            pip install -e ".[learned]"
learned = ["joblib>=1.3"]

[project.scripts]
stempade = "stempade.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
