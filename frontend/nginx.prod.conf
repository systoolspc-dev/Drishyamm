# Drishyam SPA + same-origin reverse proxy.
# Everything the browser needs lives under ONE origin so the app works
# identically over http://<ip> and https://<domain> (Cloudflare tunnel) with
# no mixed-content. Datastores + service ports stay internal to the compose net.
#
# Upstreams are resolved via Docker's embedded DNS (127.0.0.11) at REQUEST time
# using variables, so recreating backend/ai/stream-service doesn't leave nginx
# holding a stale IP (the classic nginx-in-compose gotcha).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # face-photo uploads (enrollment / person-journey) can be a few MB
  client_max_body_size 512m;   # chunked dataset parts + large face images

  # ── SPA static + client-side routing fallback ──
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Backend API (JWT, operator REST, S3 uploads) ──
  location /api/ {
    set $up_backend smart-cam-backend:5000;
    proxy_pass http://$up_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ── Socket.IO (realtime camera status + notifications) ──
  location /socket.io/ {
    set $up_backend smart-cam-backend:5000;
    proxy_pass http://$up_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # ── AI service (strip /ai → 8001; carries /ws WebSocket too) ──
  location /ai/ {
    set $up_ai smart-cam-ai:8001;
    rewrite ^/ai(/.*)$ $1 break;
    proxy_pass http://$up_ai;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # ── HLS live video (strip /hls → stream-service:8888) ──
  location /hls/ {
    set $up_hls stream-service:8888;
    rewrite ^/hls(/.*)$ $1 break;
    proxy_pass http://$up_hls;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    add_header Cache-Control no-cache;
    # MediaMTX's HLS server issues a root-relative cookieCheck redirect
    # (Location: /<path>/index.m3u8?cookieCheck=1). Because we strip /hls when
    # proxying, that Location loses the prefix and the browser lands on the SPA
    # (HTML) instead of the playlist. Re-add /hls so hls.js follows it correctly.
    absolute_redirect off;                 # keep Location relative (stay on HTTPS)
    proxy_redirect ~^/(.*)$ /hls/$1;
    proxy_cookie_path / /hls/;
  }

  # ── WHEP WebRTC signaling (strip /whep → stream-service:8889) ──
  # WebRTC *media* (ICE/UDP) can't traverse a tunnel; over HTTPS the reliable
  # video path is HLS above. Kept for direct-IP LAN access.
  location /whep/ {
    set $up_whep stream-service:8889;
    rewrite ^/whep(/.*)$ $1 break;
    proxy_pass http://$up_whep;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # head-count service — MJPEG video wall (strip /headcount -> head-count:8000)
  location /headcount/ {
    set $up_hc head-count:8000;
    rewrite ^/headcount(/.*)$ $1 break;
    proxy_pass http://$up_hc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

}
