# ═══════════════════════════════════════════════════════════════════════════
# Drishyam — full stack (VMS + AI) on one NVIDIA GPU host
#
#   cp .env.example .env                  # shared secrets + host settings
#   cp backend/.env.example backend/.env  # backend-only settings
#   docker compose up -d --build          # core stack
#
# Optional extras (profiles):
#   --profile demo       looped demo camera + footfall demo (no real camera needed)
#   --profile enhance    face-reconstruct (CodeFormer forensic enhance, :8002)
#   --profile media      per-camera NVENC transcoder + LiveKit SFU bridge
#   --profile tunnel     Cloudflare tunnel (needs ~/.cloudflared credentials)
#
# Big GPU (60+ cameras with face recognition): add the shard layout
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
#
# Host binding: app/API/AI/HLS/WHEP/SRT ports listen on ${BIND_ADDR:-0.0.0.0}.
# Servers reached through a proxy (the testing server's Tailscale edge) set
# BIND_ADDR=127.0.0.1 in .env so only the proxy is exposed. RTSP 8554 and WebRTC
# media 8189/udp always stay on all interfaces (cameras, relays, browsers).
#
# Service NAMES are part of the contract (code and env refer to smart-cam-ai,
# smart-cam-backend, mediamtx, postgres, ...). Rename containers freely,
# never the services. See docs/SETUP.md and docs/HOW_IT_WORKS.md.
# ═══════════════════════════════════════════════════════════════════════════

x-ai-env: &ai-env
  BACKEND_URL: http://smart-cam-backend:5000
  # Backend → AI calls carry X-Service-Token / JWTs signed with SERVICE_TOKEN;
  # the AI verifies with VMS_JWT_SECRET. One variable feeds both so they can
  # never drift apart (a mismatch 401s every journey/face call).
  SERVICE_TOKEN: ${SERVICE_TOKEN}
  VMS_JWT_SECRET: ${SERVICE_TOKEN}
  VMS_CAMERA_CRED_KEY: ${VMS_CAMERA_CRED_KEY:-}
  LEGACY_API_KEY: ${LEGACY_API_KEY:-}
  # VMS_JWT_DEV_BYPASS lets unauthenticated calls act as the default tenant.
  # It is ignored unless VMS_ENV=dev. Production: VMS_ENV=prod.
  VMS_ENV: ${VMS_ENV:-dev}
  VMS_JWT_DEV_BYPASS: ${VMS_JWT_DEV_BYPASS:-true}
  MEDIAMTX_RTSP_HOST: mediamtx
  MEDIAMTX_RTSP_PORT: 8554
  MEDIAMTX_RTSP_TEMPLATE: rtsp://{host}:{port}/cam_{monitor_id}
  PORT: 8001
  API_PORT: 8001
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-vms}@postgres:5432/vms_face
  POSTGRES_DSN_SYNC: postgresql+psycopg2://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-vms}@postgres:5432/vms_face
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_BUCKET_OUTPUT: vms-person-tracker
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  RECORDINGS_ROOT: /recordings
  TZ: ${TZ:-Asia/Kolkata}
  KNOWN_FACES_DIR: /srv/data/known_faces
  # Tenant the known-faces bootstrap enrols into. Customers enrol through the
  # UI under their own org and never depend on this.
  DEFAULT_TENANT_NAME: ${AI_DEFAULT_TENANT_NAME:-drisyam-default}
  # ── Face models + thresholds (docs/AI_ACCURACY_AND_TUNING.md) ──────────
  INSIGHTFACE_MODEL: buffalo_l
  INSIGHTFACE_DET_SIZE: 960
  INSIGHTFACE_CTX_ID: 0
  INSIGHTFACE_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
  INSIGHTFACE_DET_THRESHOLD: "0.5"
  # CCTV faces match studio gallery photos at cosine 0.30-0.50; 0.45 keeps
  # true matches and still rejects strangers (FNIR@FPIR=1e-3 = 0.021).
  INSIGHTFACE_REC_THRESHOLD: "0.45"
  # Embed standalone (identical vectors, 5.3x cheaper) + batch across cameras.
  RECOGNIZER_BACKEND: insightface_batched
  PIPELINE_BATCHED_INFERENCE: "true"
  # 16:9 detector input: no 44% black padding, ~33% more range per FLOP.
  INSIGHTFACE_DET_ASPECT: "1.7778"
  # SCRFD every 2nd frame; Kalman tracker fills the gaps.
  DETECT_EVERY_N_FRAMES: "2"
  MOTION_GATE_ENABLED: "true"
  MATCH_MIN_FACE_PX: "15"
  MATCH_MIN_QUALITY: "0.25"
  MATCH_MIN_BLUR_VAR: "8.0"
  TRACK_MIN_HITS_TO_MATCH: "2"
  FACE_LEARNING_MIN_SIMILARITY: "0.50"
  FACE_LEARNING_MIN_QUALITY: "0.45"
  FACE_LEARNING_MIN_FACE_PX: "60"
  FACE_LEARNING_MIN_BLUR_VAR: "20.0"
  JOURNEY_BODY_LOGGING: "true"
  PIPELINE_PERSON_DETECTION_ENABLED: ${PIPELINE_PERSON_DETECTION_ENABLED:-false}
  PIPELINE_PERSON_MODEL_PATH: /srv/data/models/yolov8n.onnx
  PIPELINE_PERSON_THRESHOLD: "0.35"
  PIPELINE_PERSON_DET_SIZE: "640"
  PIPELINE_PERSON_DETECT_EVERY_N_FRAMES: "2"
  RESTART_ONLINE_STREAMS_ON_STARTUP: "true"
  LEGACY_SINGLE_ACTIVE_CAMERA: "false"
  # First read after an on-demand RTSP open waits for a keyframe; long-GOP
  # cameras need ~9 s. If a camera's max keyframe gap is > 4 s, fix its GOP.
  PIPELINE_FRAME_TIMEOUT_SEC: "15.0"
  # ── Decode + inference runtime (docs/FACE_SYSTEM_DESIGN.md) ────────────
  RTSP_HWACCEL: ${RTSP_HWACCEL:-cuda}
  # pyav = one CUDA context per process (safe on Docker Desktop / WSL2).
  # ffmpeg = one decoder process per camera, 4x less Python CPU; use it on
  # native Linux hosts.
  RTSP_INGEST_BACKEND: ${RTSP_INGEST_BACKEND:-pyav}
  TENSORRT_ENABLED: ${TENSORRT_ENABLED:-true}
  INSIGHTFACE_RUNTIME_REPLICAS: "3"
  ATTENTION_SCHEDULING: ${ATTENTION_SCHEDULING:-true}
  # Single-process defaults. docker-compose.scale.yml overrides these for the
  # 5-shard / 4-inference-server layout.
  AI_SHARD_INDEX: "0"
  AI_SHARD_COUNT: "1"
  AI_SHARD_PRIMARY_OWNS_CAMERAS: "true"
  INFER_SERVICE_URL: ""
  VMS_INGEST_POOL_SIZE: "48"
  PYTHON_SWITCH_INTERVAL: "0"
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  WATCHFILES_FORCE_POLLING: "true"
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,utility,video

x-ai-volumes: &ai-volumes
  # Source is bind-mounted so an edit + restart is enough (no rebuild).
  - ./ai/face-service/vms_face:/srv/app/face_detection/vms_face
  - ./models/insightface:/root/.insightface
  - ./data/ai-models:/srv/data/models:ro
  - ./data/known-faces:/srv/data/known_faces:ro
  - vms-locks:/vms-locks
  - ${RECORDINGS_DIR:-./data/recordings}:/recordings:ro

x-ai-service: &ai-service
  build:
    context: ./ai/face-service
  image: drishyam/face-service:latest
  restart: unless-stopped
  environment: *ai-env
  gpus: all
  volumes: *ai-volumes

services:
  # ─── Datastores ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: drishyam-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: drishyamvms
      # Dev default = empty root password. Production: set MYSQL_ROOT_PASSWORD
      # and MYSQL_ALLOW_EMPTY_PASSWORD=no in .env BEFORE the first start.
      MYSQL_ALLOW_EMPTY_PASSWORD: "${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-}"
    ports:
      - "127.0.0.1:3307:3306"   # loopback only; containers use mysql:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: drishyam-redis
    restart: unless-stopped
    # Empty REDIS_PASSWORD = no auth (dev). If you set one, also update
    # redis_url in ai/activity-monitor/config/config.docker.yaml.
    command: ["sh", "-c", "exec redis-server --requirepass \"${REDIS_PASSWORD:-}\""]
    ports:
      # Host-side port, for running a service outside Docker. Containers use
      # redis:6379 and never need it. Override REDIS_HOST_PORT when the host
      # already has its own Redis/Valkey on 6379 (the testing server does; it
      # belongs to another project and must stay isolated from Drishyam).
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    # pgvector build of Postgres 16: the journey schema needs `vector`.
    image: pgvector/pgvector:pg16
    container_name: drishyam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-vms}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vms}"
      POSTGRES_DB: vms_face
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vms} -d vms_face"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: drishyam-qdrant
    restart: unless-stopped
    # Qdrant (RocksDB segments + one socket per client) ran out of the default
    # 1024 file handles on 2026-11-13: "Too many open files", every request hung,
    # and smart-cam-ai could not start. Give it room.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:-}"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    # Official minio/minio images are no longer pulled from Docker Hub / quay.io
    # (pull is denied), so use Bitnami's archived build of the same release.
    # Run the minio binary directly (not Bitnami's setup scripts) as root, so it
    # reads /data exactly as the official image did — existing volumes keep working.
    image: bitnamilegacy/minio:2024.10.13
    container_name: drishyam-minio
    restart: unless-stopped
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    user: "0:0"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  # Journey event spine. Single-node KRaft, reachable in-network as kafka:9092.
  kafka:
    image: apache/kafka:3.9.0
    container_name: drishyam-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Blank host (":9092"), not 0.0.0.0 — the storage-format step rejects it.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # ─── Media plane ────────────────────────────────────────────────────────
  # Drishyam Stream Service (MediaMTX): RTSP in, WebRTC/HLS out, recording.
  # Keeps the `mediamtx` alias so rtsp://mediamtx:8554 references resolve.
  stream-service:
    build:
      context: ./media/stream-service
    image: drishyam/stream-service:1.18.1
    container_name: drishyam-stream-service
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mediamtx
    environment:
      # Browsers on other machines need the host's LAN/public IP in the
      # WebRTC ICE candidates, or live view connects and shows black.
      MTX_WEBRTCADDITIONALHOSTS: "127.0.0.1,localhost,${HOST_IP:-127.0.0.1}"
    ports:
      - "127.0.0.1:9997:9997"   # control API (backend only)
      - "127.0.0.1:9998:9998"   # Prometheus metrics
      - "8554:8554"             # RTSP
      - "${BIND_ADDR:-0.0.0.0}:8898:8888"             # HLS
      - "${BIND_ADDR:-0.0.0.0}:8889:8889"             # WebRTC (WHEP)
      - "8189:8189/udp"         # WebRTC media
      - "${BIND_ADDR:-0.0.0.0}:8890:8890"             # SRT
    volumes:
      - ./media/stream-service/mediamtx.yml:/mediamtx.yml:ro
      - ${RECORDINGS_DIR:-./data/recordings}:/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ─── Backend API (Node/Express control plane) ───────────────────────────
  smart-cam-backend:
    build:
      context: ./backend
    container_name: drishyam-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Migrations + seeds, then nodemon (edits under ./backend/src restart it).
    command: ["sh", "-c", "npx sequelize-cli db:migrate && (npx sequelize-cli db:seed:all || true) && npx nodemon src/server.js"]
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: drishyamvms
      DB_USER: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-}"
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      AI_SERVICE_URL: http://smart-cam-ai:8001
      ACTIVITY_SERVICE_URL: http://activity-monitor:8000
      FACE_RECONSTRUCT_BASE: http://face-reconstruct:8002
      SMART_CAM_TRANSCODER_URL: http://smart-cam-transcoder:8004
      # The retired person-tracker's routes now proxy to smart-cam-ai /journey.
      PERSON_TRACKER_URL: http://person-tracker:8003
      PERSON_TRACKER_SERVICE_TOKEN: ${SERVICE_TOKEN}
      STREAM_SERVICE_API_URL: http://stream-service:9997
      MEDIAMTX_API_URL: http://stream-service:9997   # streamSupervisor health polls (env.js defaults to localhost)
      STREAM_SERVICE_INTERNAL_HLS_URL: http://stream-service:8888
      # Browser-facing media URLs — must be reachable from the operator's PC.
      STREAM_SERVICE_HLS_URL: ${PUBLIC_HLS_URL:-http://localhost:8898}
      STREAM_SERVICE_WEBRTC_URL: ${PUBLIC_WEBRTC_URL:-http://localhost:8889}
      STREAM_SERVICE_RTSP_HOST: stream-service
      STREAM_SERVICE_RECORDINGS_DIR: /recordings
      # Sub-stream recording for every camera keeps every NVR session open
      # 24/7 and jams weak NVRs. Recording is enabled per camera in the UI.
      RECORD_SUB: "0"
      TRANSCODER_ALLOW_HW: "true"
      # Encoder slots for browser-compat (H.265 → H.264) transcodes.
      TRANSCODER_MAX: "24"
      # Hold the RTSP pull 5 min after the last viewer: a short hold caused a
      # reconnect storm that NVRs throttle.
      SOURCE_CLOSE_AFTER: "5m"
      # Live relay audio (G.711 → AAC) OFF, as in production. With it on, ffmpeg
      # fails to open the audio output on some cameras ("Could not write header
      # ... output stream 0:1"), the relay crash-loops, and tiles fall back to
      # WebRTC + CPU H.264 transcode: measured 2026-11-09, 55-78 % of Monitor
      # Wall tiles never played. Set RELAY_AUDIO=1 in .env to try audio.
      RELAY_AUDIO: "${RELAY_AUDIO:-0}"
      # Dev only: don't rate-limit requests from private / Docker addresses. Under
      # Docker every browser tab on this machine shares one client IP (the bridge
      # gateway) and one 5000/15 min bucket, so a Monitor Wall plus a couple of
      # tabs ran it dry and the whole UI went 429. NOT set in production compose.
      RATE_LIMIT_SKIP_PRIVATE: "1"
      # Quarantine a flapping camera after 4 flaps in 2 min, for 10 min.
      SUPERVISOR_FLAP_LIMIT: "4"
      SUPERVISOR_FLAP_WINDOW_MS: "120000"
      SUPERVISOR_QUARANTINE_MS: "600000"
      FRONTEND_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CHOKIDAR_USEPOLLING: "true"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    ports:
      - "${BIND_ADDR:-0.0.0.0}:5000:5000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - ${RECORDINGS_DIR:-./data/recordings}:/recordings
    gpus: all   # NVENC for H.265 → H.264 transcodes spawned by the backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      stream-service:
        condition: service_started

  # ─── Console (React + Vite) ─────────────────────────────────────────────
  smart-cam-app:
    build:
      context: ./frontend
    container_name: drishyam-app
    restart: unless-stopped
    environment:
      # The BROWSER calls this, so it must be the host's address as seen by
      # operators, not a container name.
      VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:5173:5173"
    volumes:
      - ./frontend:/app
      - app-node-modules:/app/node_modules
    depends_on:
      smart-cam-backend:
        condition: service_started

  # ─── Face / journey / footfall AI (vms_face) ────────────────────────────
  # API + camera pipelines. Owns the Alembic migrations.
  smart-cam-ai:
    <<: *ai-service
    container_name: drishyam-ai
    # No --reload: under the reloader a crashed worker leaves the port open
    # and every request hangs. Without it the container exits and restarts.
    command: ["sh", "-c", "alembic upgrade head && uvicorn vms_face.api.main:app --host 0.0.0.0 --port 8001"]
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 300s   # first boot builds TensorRT engines (minutes)
    depends_on:
      smart-cam-backend:
        condition: service_started
      stream-service:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started

  # Watchlist / gallery match worker (consumes face events, raises alerts).
  smart-cam-ai-worker:
    <<: *ai-service
    container_name: drishyam-ai-worker
    command: ["python", "-m", "vms_face.workers.match_worker"]
    depends_on:
      smart-cam-ai:
        condition: service_started

  # Forensic journey renderer (FFmpeg clip → concat → MP4 + PDF + map).
  # CPU only; keep ONE replica on a host that also runs live AI.
  journey-stitch-worker:
    image: drishyam/face-service:latest
    container_name: drishyam-journey-stitch-worker
    restart: unless-stopped
    command: ["python", "-m", "vms_face.workers.stitch_worker"]
    volumes: *ai-volumes
    environment:
      <<: *ai-env
      CLIP_PAD_BEFORE_SEC: "2"
      CLIP_PAD_AFTER_SEC: "4"
      STITCH_MAX_TOTAL_SEC: "600"
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started

  # ─── Head count / occupancy (YOLOv8 head detector, :8020) ───────────────
  head-count:
    build:
      context: ./ai/head-count
      dockerfile: Dockerfile.gpu
    image: drishyam/head-count:latest
    container_name: drishyam-head-count
    restart: unless-stopped
    gpus: all
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      BACKEND_URL: http://smart-cam-backend:5000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      # H.265 NVRs drop UDP packets → decode corruption; force RTSP over TCP.
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp"
      HEADCOUNT_FORWARD__ENABLED: "true"
    volumes:
      - ./ai/head-count/config:/srv/head-count/config
      - ./ai/head-count/models:/srv/head-count/models
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8020:8000"
    depends_on:
      smart-cam-backend:
        condition: service_started
      stream-service:
        condition: service_started

  # ─── Restricted-zone person detection ("zone-guard") ────────────────────
  # YOLO person boxes → backend ai.live.overlay → zone engine → alerts, so a
  # zone fires on anyone, face or no face. Reuses the head-count image.
  zone-guard:
    image: drishyam/head-count:latest
    container_name: drishyam-zone-guard
    restart: unless-stopped
    gpus: all
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      BACKEND_URL: http://smart-cam-backend:5000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp"
      # `all` = every camera in the registry, or a comma list of monitorIds.
      ZONE_SIM_MONITORS: ${ZONE_GUARD_MONITORS:-all}
      # Optional monitorId=rtsp://... overrides (the demo profile sets one).
      ZONE_SIM_SOURCES: ${ZONE_GUARD_SOURCES:-}
      ZONE_SIM_MODEL: /models/yolov8n.pt
      ZONE_SIM_FPS: "4"
      ZONE_SIM_CONF: "0.35"
    entrypoint: ["python", "-u", "/srv/zone-guard/zone_sim.py"]
    volumes:
      - ./ai/zone-guard:/srv/zone-guard:ro
      - ./models/person/yolov8n.pt:/models/yolov8n.pt:ro
    depends_on:
      head-count:
        condition: service_started
      smart-cam-backend:
        condition: service_started

  # ─── Activity monitor (phone use / working / attendance, :8010, CPU) ────
  activity-monitor:
    build:
      context: ./ai/activity-monitor
    image: drishyam/activity-monitor:latest
    container_name: drishyam-activity-monitor
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "rtsp_transport;tcp"
      RECOGNITION_PG_DSN: postgresql://${POSTGRES_USER:-vms}:${POSTGRES_PASSWORD:-vms}@postgres:5432/vms_face
      # Same person unseen for < 1 h = same visit (not clock-out + clock-in).
      RECOGNITION_SESSION_GAP_SEC: "3600"
      RECOGNITION_MIN_DETECTIONS: "3"
      # Door cameras (camera codes, comma list): IN at first sighting, OUT at last.
      RECOGNITION_ENTRY_CAMERAS: ${ACTIVITY_ENTRY_CAMERAS:-}
      RECOGNITION_MIN_SIMILARITY: "0.5"
      RECOGNITION_BREAK_GAP_SEC: "900"
      ALERTS_ENABLED: "1"
      ALERT_BUSINESS_HOURS: ${ACTIVITY_BUSINESS_HOURS:-07:00-21:00}
      ALERT_STRANGER_DWELL_SEC: "180"
      ALERT_STRANGER_AFTER_HOURS_ONLY: "1"
      ALERT_WATCHLIST: ${ACTIVITY_ALERT_WATCHLIST:-}
    volumes:
      - ./ai/activity-monitor/config:/srv/activity-monitor/config
      - activity-monitor-data:/srv/activity-monitor/data
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8010:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      stream-service:
        condition: service_started

  # ═══ Optional: --profile enhance ════════════════════════════════════════
  # CodeFormer + Real-ESRGAN forensic face restoration, behind the backend's
  # POST /api/ai/enhance. Own image (basicsr/torchvision conflict with the
  # face-service stack). Weights ship in models/face-reconstruct, so nothing
  # downloads on first start. Output can hallucinate: never use it for ID.
  face-reconstruct:
    profiles: ["enhance"]
    build:
      context: ./ai/face-reconstruct
    image: drishyam/face-reconstruct:latest
    container_name: drishyam-face-reconstruct
    restart: unless-stopped
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      PYTHONUNBUFFERED: "1"
    ports:
      - "8002:8002"
    volumes:
      - ./ai/face-reconstruct/backend:/srv/backend
      - ./models/face-reconstruct:/srv/CodeFormer/weights

  # ═══ Optional: --profile media ══════════════════════════════════════════
  # Per-camera NVENC normalisation to cam_<id>_clean (admin-enabled per camera).
  smart-cam-transcoder:
    profiles: ["media"]
    build:
      context: ./media/transcoder
    container_name: drishyam-transcoder
    restart: unless-stopped
    gpus: all
    environment:
      PORT: 8004
      MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_API_USER: ${STREAM_API_USER:-drishyam}
      MEDIAMTX_API_PASS: ${STREAM_API_PASS:-drishyam123}
      CLEAN_PATH_SUFFIX: _clean
      NVENC_CODEC: h264_nvenc
      NVENC_PRESET: p4
      NVENC_TUNE: ll
      NVENC_PROFILE: baseline
      NVENC_BITRATE_KBPS: "4000"
      NVENC_MAXRATE_KBPS: "5000"
      NVENC_GOP_SECONDS: "2.0"
      NVENC_FPS: "25"
      NVENC_AUDIO: copy
      MAX_CONCURRENT_TRANSCODERS: "16"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      PYTHONUNBUFFERED: "1"
    ports:
      - "8004:8004"
    volumes:
      - ./media/transcoder/app:/app/app
    depends_on:
      stream-service:
        condition: service_started

  # RTSP → LiveKit (WHIP) publisher for SFU fan-out. Needs LIVEKIT_* in .env.
  smart-cam-sfu-bridge:
    profiles: ["media"]
    build:
      context: ./media/sfu-bridge
    container_name: drishyam-sfu-bridge
    restart: unless-stopped
    environment:
      PORT: 8005
      MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
      CLEAN_PATH_SUFFIX: _clean
      LIVEKIT_URL: ${LIVEKIT_WS_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_PUBLISH_TTL_SEC: "3600"
      MAX_CONCURRENT_PUBLISHERS: "100"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8005:8005"
    volumes:
      - ./media/sfu-bridge/app:/app/app
    depends_on:
      stream-service:
        condition: service_started

  # ═══ Optional: --profile demo ═══════════════════════════════════════════
  # Loops demo/videos/crowd.mp4 into the stream service at rtsp://…/demo_src.
  # Add a camera in the console with that RTSP URL and Live View, head count,
  # zones and the occupancy pipeline all have a real source. For zone-guard
  # on it, set in .env:
  #   ZONE_GUARD_SOURCES=<monitorId>=rtsp://stream-service:8554/demo_src
  local-demo-cam:
    profiles: ["demo"]
    image: drishyam/face-service:latest      # already has ffmpeg
    container_name: drishyam-demo-cam
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          # Re-encoded (not -c copy): a short GOP so late joiners get a keyframe.
          ffmpeg -hide_banner -loglevel warning -re -stream_loop -1 -fflags +genpts \
            -i /demo/crowd.mp4 -an -c:v libx264 -preset veryfast -bf 0 -profile:v baseline \
            -pix_fmt yuv420p -g 30 -f rtsp -rtsp_transport tcp rtsp://stream-service:8554/demo_src
          echo "demo publisher exited; restarting in 3s"; sleep 3
        done
    volumes:
      - ./demo/videos/crowd.mp4:/demo/crowd.mp4:ro
    depends_on:
      stream-service:
        condition: service_started

  # Loops a "people crossing a line" clip as cam_demo-entrance and registers it
  # as a footfall camera, so /ai-event/footfall counts with no real camera.
  footfall-demo:
    profiles: ["demo"]
    image: drishyam/face-service:latest
    container_name: drishyam-footfall-demo
    restart: unless-stopped
    entrypoint: ["python", "/demo/footfall_publisher.py"]
    environment:
      AI_BASE: http://smart-cam-ai:8001
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_RTSP_PORT: "8554"
      DEMO_CAMERA_CODE: demo-entrance
      DEMO_VIDEO: /demo/footfall.mp4
      DEMO_LINE_Y_FRAC: "0.5"
      DEMO_DIRECTION: down_is_in
      DEMO_TARGET_FPS: "8"
    volumes:
      - ./demo/footfall_publisher.py:/demo/footfall_publisher.py:ro
      - ./demo/videos/FootfallVideo.mp4:/demo/footfall.mp4:ro
    depends_on:
      stream-service:
        condition: service_started
      smart-cam-ai:
        condition: service_started

  # ═══ Optional: --profile tunnel ═════════════════════════════════════════
  # Public HTTPS without port forwarding. Needs a tunnel created with the
  # cloudflared CLI; see deploy/cloudflared/README.md.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.5.0
    container_name: drishyam-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/${CLOUDFLARED_CONFIG:-config.yml}", "run"]
    volumes:
      - ${CLOUDFLARED_DIR:-./deploy/cloudflared/credentials}:/etc/cloudflared:ro
    depends_on:
      smart-cam-backend:
        condition: service_started

volumes:
  # flock file for one-at-a-time CUDA/NVDEC context creation (infra/cuda_gate.py)
  vms-locks:
  mysql-data:
  postgres-data:
  qdrant-data:
  minio-data:
  kafka-data:
  app-node-modules:
  backend-node-modules:
  activity-monitor-data:
