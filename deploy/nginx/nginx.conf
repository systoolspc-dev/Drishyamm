# Drisyam VMS — NGINX edge for 2k-camera production deployments.
#
# Topology:
#   /api/           → Express API + WebSocket (smart-cam-backend:5000)
#   /live/<path>/   → MediaMTX WebRTC WHEP    (mediamtx:8889)  — sub-500ms
#   /hls/<path>/    → MediaMTX HLS            (mediamtx:8888)  — ~2s latency
#   /metrics, /health/full → restricted to ops CIDRs only
#
# Tuning notes
#   * worker_connections 65k + worker_rlimit_nofile 100k → headroom for 2k WebRTC
#     signalling sockets + 4k HLS readers + ~4k upstream keep-alives.
#   * Per-IP rate limit on /api/ (60r/s burst 120) — keeps a single rogue tab from
#     exhausting the backend; doesn't apply to /hls/ /live/ which serve the same
#     player many times legitimately.
#   * proxy_buffering OFF on /live/  — WebRTC signalling is bidirectional, low-latency,
#                                       buffering would stall the offer/answer SDP.
#   * proxy_buffering OFF on /hls/   — segments are already small + chunked; buffering
#                                       costs RAM at scale (4k clients × 256k = 1 GB).
#   * keepalive 256 to backend       — long-lived browser sessions reuse upstream TCP.
#   * resolver lines required for service-name DNS in Docker / K8s (works with
#     127.0.0.11 in Docker; replace with kube-dns IP in K8s).

worker_processes      auto;
worker_rlimit_nofile  100000;
error_log             /var/log/nginx/error.log warn;
pid                   /var/run/nginx.pid;

events {
    worker_connections  65536;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access log — Loki / Datadog / CloudWatch friendly
    log_format  json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"req_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"ua":"$http_user_agent",'
            '"ref":"$http_referer"'
        '}';
    access_log  /var/log/nginx/access.log  json;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Don't leak version
    server_tokens off;

    # Compression — never gzip media segments, only API + static
    gzip               on;
    gzip_proxied       any;
    gzip_min_length    1024;
    gzip_comp_level    5;
    gzip_types         text/plain text/css application/json application/javascript application/xml;

    # ── CORS allowlist for media (HLS/WHEP) ───────────────────────────────────
    # Was Access-Control-Allow-Origin "*", which let ANY site embed and pull the
    # camera segments. Echo the Origin back ONLY when it's a known app origin;
    # anything else gets no CORS header (browser blocks the cross-origin read).
    # Keep this list in sync with the backend CORS_ORIGINS. Empty $cors_origin →
    # nginx omits the header entirely (same-origin playback is unaffected).
    map $http_origin $cors_origin {
        default                                   "";
        "~^https?://localhost(:[0-9]+)?$"         $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$"      $http_origin;
        "https://drishyamapi.indyatools.com"      $http_origin;
        "http://drishyam.netforchoice.com"        $http_origin;
        "https://drishyam.netforchoice.com"       $http_origin;
        "http://103.109.7.37"                     $http_origin;
    }

    # ── Rate-limit zones ──────────────────────────────────────────────────────
    # A 50MB zone holds ~800k unique IPs; sufficient for a campus deployment.
    limit_req_zone $binary_remote_addr zone=api_per_ip:50m   rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m  rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Trust proxy headers if NGINX is behind another L7 (cloud LB)
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    # ── Resolver for upstream service-name lookups in containers ─────────────
    # Re-resolves every 30s so a rolling MediaMTX redeploy doesn't pin to dead IPs
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Upstream pools ────────────────────────────────────────────────────────
    upstream backend_api {
        # `least_conn` distributes WebSocket sessions evenly across replicas
        least_conn;
        server smart-cam-backend:5000 max_fails=3 fail_timeout=15s;
        # Add more replicas here in production:
        # server smart-cam-backend-2:5000 max_fails=3 fail_timeout=15s;
        # server smart-cam-backend-3:5000 max_fails=3 fail_timeout=15s;
        keepalive 256;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    upstream mediamtx_webrtc {
        # WebRTC signalling is sticky — same client should stay on same MediaMTX
        # for the lifetime of the offer/answer; ip_hash gives that for free.
        ip_hash;
        server mediamtx:8889 max_fails=3 fail_timeout=15s;
        keepalive 1024;
    }

    upstream mediamtx_hls {
        # HLS is fully stateless; round-robin is fine
        server mediamtx:8888 max_fails=3 fail_timeout=15s;
        keepalive 512;
        keepalive_requests 10000;
    }

    # ── Common locations (defined once, referenced from each server block) ────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP server (development / behind cloud TLS) ─────────────────────────
    server {
        listen 80 default_server reuseport;
        listen [::]:80 default_server reuseport;
        server_name _;

        # ── REST API ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req  zone=api_per_ip burst=120 nodelay;
            limit_conn conn_per_ip 200;

            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    120s;
            proxy_buffer_size     8k;
            proxy_buffers         16 16k;
            client_max_body_size  20m;     # bulk camera CSV import; thumbnail upload
        }

        # Tighter limit on auth — prevents credential stuffing
        location ~ ^/api/auth/(login|forgot-password|reset-password) {
            limit_req  zone=auth_per_ip burst=10 nodelay;
            limit_conn conn_per_ip 20;
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── WebSocket (Socket.IO) ────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;
        }

        # ── MediaMTX WebRTC WHEP — sub-500ms single-view ─────────────────────
        location /live/ {
            # auth_request /_stream_auth;   # H9 — uncomment with /hls/ to protect streams
            proxy_pass         http://mediamtx_webrtc/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Echo only known app origins (see $cors_origin map), not any origin.
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Vary Origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE, PATCH" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type,If-Match" always;
            add_header Access-Control-Expose-Headers "ETag,Location" always;
            if ($request_method = OPTIONS) { return 204; }
        }

        # ── Media-plane authorization (audit H9) ─────────────────────────────
        # Internal endpoint the auth_request subrequests hit. It forwards the
        # ORIGINAL media URI + the browser's stream cookie to the backend, which
        # validates the per-camera token. Returns 204 (allow) / 401 (deny).
        # Backend allows-all when STREAM_URL_SECRET is unset, so this is inert
        # until you enable the feature. See docs/STREAM_SECURITY.md.
        location = /_stream_auth {
            internal;
            proxy_pass              http://backend_api/api/stream/verify;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_set_header        Cookie $http_cookie;
        }

        # ── MediaMTX HLS — grid / mobile / archival fallback ─────────────────
        location /hls/ {
            # TO PROTECT STREAMS: set STREAM_URL_SECRET in the backend, then
            # uncomment the next line (also in /live/ below) + `nginx -t` + reload.
            # auth_request /_stream_auth;
            proxy_pass         http://mediamtx_hls/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 30s;
            proxy_buffering    off;
            proxy_request_buffering off;

            # m3u8 must NEVER be cached by the browser; segments may be cached briefly
            location ~ \.m3u8$ {
                proxy_pass http://mediamtx_hls;
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Vary Origin always;
            }
            location ~ \.(ts|m4s|mp4)$ {
                proxy_pass http://mediamtx_hls;
                add_header Cache-Control "public, max-age=10" always;
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Vary Origin always;
            }
        }

        # ── Restricted: Prometheus + deep health (ops-only) ─────────────────
        # Allowlist your monitoring IP(s) here. The default below is permissive
        # for dev — TIGHTEN before production.
        location = /api/metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            # deny all;          # uncomment in production
            proxy_pass http://backend_api/api/metrics;
        }
        location = /api/health/full {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            # deny all;          # uncomment in production
            proxy_pass http://backend_api/api/health/full;
        }

        # Shallow health for LB probes
        location = /healthz {
            access_log off;
            proxy_pass http://backend_api/api/health/live;
        }
    }

    # ── HTTPS server (production) ────────────────────────────────────────────
    # Uncomment + set your certificate paths.
    # server {
    #     listen 443 ssl http2 reuseport;
    #     server_name vms.example.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    #     ssl_session_cache   shared:SSL:50m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # Strict transport security — uncomment after verifying TLS works
    #     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # ... copy all location {} blocks from the HTTP server above ...
    # }
    # server {
    #     listen 80;
    #     server_name vms.example.com;
    #     return 301 https://$host$request_uri;
    # }
}
