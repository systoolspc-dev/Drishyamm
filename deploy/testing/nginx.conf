# Testing-server edge: ONE origin for the whole stack.
#
#   tailscale serve (HTTPS, tailnet only) ──▶ 127.0.0.1:8080 ──▶ this nginx ──▶ services
#
# Paths:
#   /            → smart-cam-app:5173   (Vite dev server, incl. HMR WebSocket)
#   /api/        → smart-cam-backend:5000 (REST + /api/stream/live relay WebSocket)
#   /socket.io/  → smart-cam-backend:5000 (Socket.IO)
#   /ai/         → smart-cam-ai:8001/     (prefix stripped; REST, MJPEG, /ws)
#   /hls/        → stream-service:8888/   (prefix stripped)
#   /live/       → stream-service:8889/   (WHEP signalling; prefix stripped)
#
# WebRTC media itself (UDP 8189) does not pass through here: browsers on the
# tailnet reach it directly on the machine's Tailscale IP (HOST_IP in .env).
#
# Production uses deploy/nginx/nginx.conf, which is a different file on purpose.
# This one is deliberately simple: no TLS (tailscale serve terminates it), no
# rate limits, no stream auth sub-request.

worker_processes auto;
events { worker_connections 4096; }

http {
    # Docker's DNS. Upstreams are resolved per request (variables below), so a
    # recreated container with a new IP doesn't leave nginx pointing at the old one,
    # and nginx starts even if a service is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Who is asking? ───────────────────────────────────────────────────────
    # tailscale serve adds Tailscale-User-Login for signed-in tailnet users and
    # strips any client-supplied Tailscale-* headers. No header ⇒ the request came
    # in through Funnel (the public internet) ⇒ treat as public. Fails closed.
    map $http_tailscale_user_login $is_public {
        ""      1;
        default 0;
    }
    # Real client IP for the backend (rate limits, audit logs). tailscale serve
    # appends the true client address to X-Forwarded-For; Express (`trust proxy 1`)
    # takes the last entry, so pass tailscale's header through instead of
    # appending nginx's own peer (the Docker gateway).
    map $http_x_forwarded_for $client_xff {
        ""      $remote_addr;
        default $http_x_forwarded_for;
    }

    sendfile on;
    client_max_body_size 512m;          # face enrolment / video uploads
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $client_xff;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout  3600s;          # sockets, MJPEG and long polls
    proxy_send_timeout  3600s;
    proxy_buffering off;                # MJPEG / live streams must not buffer

    log_format edge '$time_iso8601 client=$client_xff public=$is_public '
                    '"$request" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout edge;
    error_log  /dev/stderr warn;

    server {
        listen 80 default_server;
        server_name _;
        absolute_redirect off;          # keep Location relative: TLS ends at tailscale serve

        set $app     smart-cam-app:5173;
        set $backend smart-cam-backend:5000;
        set $ai      smart-cam-ai:8001;
        set $hls     stream-service:8888;
        set $whep    stream-service:8889;

        location = /edge-health { return 200 "ok\n"; }

        location /api/ {
            proxy_pass http://$backend;
        }

        location /socket.io/ {
            proxy_pass http://$backend;
        }

        location /ai/ {
            rewrite ^/ai/(.*)$ /$1 break;
            proxy_pass http://$ai;
        }

        location /hls/ {
            rewrite ^/hls/(.*)$ /$1 break;
            proxy_pass http://$hls;
            proxy_redirect / /hls/;     # MediaMTX redirects (cookieCheck) are root-relative
        }

        location /live/ {
            rewrite ^/live/(.*)$ /$1 break;
            proxy_pass http://$whep;
            proxy_redirect / /live/;    # WHEP session Location header is root-relative
        }

        location / {
            proxy_pass http://$app;
        }
    }
}
