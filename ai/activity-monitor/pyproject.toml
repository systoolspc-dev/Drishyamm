[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-monitor"
version = "1.0.0"
description = "Per-person activity monitoring (working / not_working / on_phone) over REST"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4",
    "opencv-python-headless>=4.11",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "huggingface-hub>=0.27",
    # NOTE: torch is pulled in by ultralytics. On Jetson/Pi install the vendor
    # torch wheel FIRST, then `pip install -e .`, so it isn't overwritten.
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
identity = ["redis>=5"]   # face-name fusion from vms_face's cam-state channel

[project.scripts]
activity-monitor = "activity_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
activity_monitor = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
