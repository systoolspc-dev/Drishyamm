# Activity-monitor configuration: per-person working / not_working / on_phone / talking.
# Head counting lives in the separate ../head-count project.
# Override any value with env vars: HEADCOUNT_API__PORT=9000, etc.

# Detectors here feed the activity analyzer (phones) — no head counting.
detectors:
  - id: phones
    label: phones           # model class is "using phone"
    weights: models/phone.pt
    color: [0, 165, 255]    # orange (BGR)
    device: auto
    half: false
    conf: 0.50             # raised from 0.35 to cut false positives (hands-near-face poses)
    imgsz: 1280             # wide CCTV: phones are small/distant → need higher resolution

# Per-person activity: working / on_phone / distracted.
# Requires a camera that FACES people (sees their faces). Thresholds below are
# UNVALIDATED defaults — tune on real footage with: python probe_activity.py frame.jpg
activity:
  enabled: true
  pose_weights: models/yolov8s-pose.pt   # 's' has much better recall than 'n' on wide shots
  phone_detector_id: phones     # which detector supplies phone boxes
  device: auto
  conf: 0.40                    # pose person confidence
  imgsz: 1280                   # higher = better recall on wide shots / distant people (more compute)
  # working = upright (upper-body). head below shoulders = slumped; reclined torso (if hips seen) = not working
  posture_head_down: -0.50      # head_lift (head elevation / shoulder width) below this = head-down
  posture_tilt_max: 28.0        # reclined torso tilt from vertical, deg (only when hips visible)
  posture_buried_head: true     # clear shoulders + no visible face (head in arms) => not_working
  posture_face_min: 0.45        # best head-keypoint confidence below this = face hidden
  phone_overlap: 0.30           # phone box must be >=30% inside a person to attribute
  phone_require_hand: true      # AND near a wrist/head keypoint — rejects phones lying on the desk
  phone_hand_radius: 1.3        # max phone->hand/head distance as a multiple of shoulder width
  hold_seconds: 1.5             # a state must persist this long before switching
  # talking = two people near each other + turned toward each other, sustained.
  # Disabled: unreliable on overhead/side CCTV (needs faces seen straight-on).
  talking_enabled: false
  talking_proximity: 2.5        # max center distance / avg body width
  talking_convergence: 0.20     # min |head yaw| turned toward each other
  # per-person over-time ledger: time-in-state + phone-usage sessions (count + duration)
  ledger_enabled: true
  store_path: activity.db       # SQLite: durable daily totals + phone-session log
  ledger_flush_sec: 30          # persist running daily totals this often
  session_gap_sec: 3.0          # close an open phone session after this gap unseen

pipeline:
  smooth_window: 5        # rolling-median window (frames); 1 disables smoothing
  infer_every: 1          # run inference on every Nth captured frame (raise to save CPU)
  target_fps: 0           # cap inference rate; 0 = as fast as possible
  reconnect_delay: 3.0    # seconds before first reconnect attempt
  max_reconnect_delay: 30.0
  read_timeout: 10.0      # seconds without a frame before treating the stream as dead

# Optional: name the anonymous body tracks from vms_face's face recognition.
# Subscribes to Redis `vms.cam.state:*` and matches each body box to the
# recognised face inside it. Map each stream to its vms_face camera_code below.
identity:
  enabled: false                        # turn on when running alongside vms_face
  redis_url: "redis://localhost:6379/0" # the vms_face Redis
  channel_prefix: "vms.cam.state"
  ttl_sec: 3.0
  head_region: 0.6

api:
  host: 0.0.0.0
  port: 8000

log_level: INFO

streams:
  - id: cam1
    name: "Webcam"
    source: 0             # int index, file path, or rtsp://... URL
    # vms_camera: "38aa633bd49e4899b0743b79"   # vms_face camera_code → per-person names
  # - id: lobby
  #   name: "Lobby Camera"
  #   source: "rtsp://user:pass@192.168.1.50:554/stream1"
  #   vms_camera: "<monitorId>"
