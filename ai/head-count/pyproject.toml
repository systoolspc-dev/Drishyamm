[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headcount"
version = "1.0.0"
description = "Real-time multi-stream head counting over a REST API"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4",
    "opencv-python-headless>=4.11",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "huggingface-hub>=0.27",
    # NOTE: torch is pulled in by ultralytics. On Jetson/Pi install the vendor
    # torch wheel FIRST, then `pip install -e .`, so it isn't overwritten.
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
preview = ["opencv-python>=4.11"]   # GUI window for scripts/preview.py

[project.scripts]
headcount = "headcount.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
headcount = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
